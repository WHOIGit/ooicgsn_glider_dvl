name: ooicgsn_glider_dvl
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - typer
  - loguru
  - tqdm
  - ipython
  - jupyterlab
  - notebook
  - matplotlib
  - cartopy
  - cmocean
  - plotly
  - numpy
  - pandas
  - scikit-learn
  - scipy
  - xarray
  - h5netcdf
  - netCDF4
  - beautifulsoup4
  - httpx
  - ruff
  - pip:
    - erddapy
    - python-dotenv
    - mkdocs
    - -e .
# Notebook 1 also uses the OOI data-access packages `ooinet` and
# `ooi_data_explorations`, which are installed separately from GitHub.
